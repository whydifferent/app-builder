<!DOCTYPE html>
<html>
<head>
<title>App Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body style="font-family:Arial; background:#111; color:white; text-align:center;">

<h2>Create Your App</h2>

<form action="/generate" method="POST" enctype="multipart/form-data">

<input type="text" name="app_name" placeholder="App Name" required><br><br>

<input type="url" name="app_url" placeholder="Website URL" required><br><br>

<label>Icon 192x192</label><br>
<input type="file" name="icon192" required><br><br>

<label>Icon 512x512</label><br>
<input type="file" name="icon512" required><br><br>

<button type="submit">Generate App</button>

</form>

</body>
</html>
